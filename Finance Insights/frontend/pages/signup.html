<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Finance Insights</title>

    <link
        rel="stylesheet"
        href="/css/common.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/signup.css"
    >

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/auth.js"
        defer
    ></script>

    <script
        src="/js/signup.js"
        defer
    ></script>

</head>


<body class="auth-page">

    <div class="auth-card signup-card">

        <div class="auth-brand">
            Finance Insights
        </div>

        <p class="auth-subtitle">
            Create your account to get started
        </p>

        <!-- Shared validation / status message -->
        <div
            id="availability-message"
            class="availability-message"
            aria-live="polite"
        ></div>

        <div
            id="loading"
            class="loading"
        ></div>

        <form
            id="signup-form"
            autocomplete="off"
        >

            <div class="signup-grid">

                <!-- Profile Name -->
                <div class="input-wrapper">

                    <label for="profile-name">
                        Profile Name
                    </label>

                    <input
                        id="profile-name"
                        name="profile_name"
                        type="text"
                        placeholder="Enter your name"
                        required
                        autofocus
                    >

                </div>


                <!-- Username -->
                <div class="input-wrapper">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="input-wrapper">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- OTP -->
                <div class="input-wrapper">

                    <label for="otp">
                        Email Verification OTP
                    </label>

                    <div class="otp-row">

                        <input
                            id="otp"
                            name="otp"
                            type="text"
                            inputmode="numeric"
                            maxlength="6"
                            placeholder="6-digit OTP"
                            required
                        >

                        <button
                            id="send-otp-button"
                            type="button"
                        >
                            Send OTP
                        </button>

                        <button
                            id="verify-otp-button"
                            type="button"
                            disabled
                        >
                            Verify OTP
                        </button>

                    </div>

                </div>


                <!-- Password -->
                <div class="input-wrapper password-wrapper">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                    >
                        Show
                    </button>

                </div>


                <!-- Confirm Password -->
                <div class="input-wrapper password-wrapper">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        id="confirm-password"
                        name="confirm_password"
                        type="password"
                        placeholder="Re-enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirm-password"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                id="signup-button"
                type="submit"
                disabled
            >
                Create Account
            </button>

        </form>


        <div class="auth-links">

            <a href="/login">
                Already have an account? Login
            </a>

        </div>

    </div>

</body>

</html>
