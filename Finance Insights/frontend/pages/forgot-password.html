<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Finance Insights</title>

    <link
        rel="stylesheet"
        href="/css/common.css"
    >

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <link
        rel="stylesheet"
        href="/css/forgot-password.css"
    >

    <script
        src="/js/api.js"
        defer
    ></script>

    <script
        src="/js/auth.js"
        defer
    ></script>

    <script
        src="/js/forgot-password.js"
        defer
    ></script>

</head>


<body class="auth-page">

    <div class="auth-card reset-card">

        <div class="auth-brand">
            Finance Insights
        </div>

        <h2>
            Reset Password
        </h2>

        <p class="auth-subtitle">
            Verify your email to reset your password
        </p>


        <!-- Shared validation / status message -->

        <div
            id="message"
            class="availability-message"
            aria-live="polite"
        ></div>


        <div
            id="loading"
            class="loading"
        ></div>


        <form
            id="reset-password-form"
            autocomplete="off"
        >

            <!-- Email -->

            <div class="input-wrapper">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your registered email"
                    required
                    autofocus
                >

            </div>


            <!-- OTP -->

            <div class="input-wrapper">

                <label for="otp">
                    Verification OTP
                </label>

                <div class="otp-row">

                    <input
                        id="otp"
                        name="otp"
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        placeholder="6-digit OTP"
                        required
                    >

                    <button
                        id="send-otp-button"
                        type="button"
                    >
                        Send OTP
                    </button>

                    <button
                        id="verify-otp-button"
                        type="button"
                        disabled
                    >
                        Verify OTP
                    </button>

                </div>

            </div>


            <!-- New Password -->

            <div class="input-wrapper password-wrapper">

                <label for="new-password">
                    New Password
                </label>

                <input
                    id="new-password"
                    name="new_password"
                    type="password"
                    placeholder="Enter your new password"
                    required
                    disabled
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="new-password"
                >
                    Show
                </button>

            </div>


            <!-- Confirm Password -->

            <div class="input-wrapper password-wrapper">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    id="confirm-password"
                    name="confirm_password"
                    type="password"
                    placeholder="Re-enter your new password"
                    required
                    disabled
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirm-password"
                >
                    Show
                </button>

            </div>


            <!-- Reset -->

            <button
                id="reset-password-button"
                type="submit"
                disabled
            >
                Reset Password
            </button>

        </form>


        <div class="auth-links">

            <a href="/login">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
